<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Come il componente LevelMark: cinque barre di livello centrate (45, 100, 65, 85, 30%),
       larghe il doppio dello spazio tra loro. Disegnate sulla griglia di 16 pixel, così restano nitide nella scheda. -->
  <style>
    rect { fill: #1F5866; }
    @media (prefers-color-scheme: dark) { rect { fill: #8FCDB9; } }
  </style>
  <rect x="1" y="5" width="2" height="6"/>
  <rect x="4" y="1" width="2" height="14"/>
  <rect x="7" y="3" width="2" height="10"/>
  <rect x="10" y="2" width="2" height="12"/>
  <rect x="13" y="6" width="2" height="4"/>
</svg>
