<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonora</title>
    <!-- Applica il tema salvato prima del primo disegno, per evitare il lampo chiaro in modalità scura.
         La chiave deve coincidere con THEME_STORAGE_KEY in src/lib/theme.ts -->
    <script>
      try {
        var t = localStorage.getItem("sonora-theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.classList.add(t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
